<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            overflow: hidden;
        }
        .navbar .username {
            font-size: 18px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .navbar .button-group {
            display: flex;
            align-items: center;
        }
        .navbar .home {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        .navbar .home:hover {
            background-color: #45a049;
        }
        .navbar .login,
        .navbar .register {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            margin-left: 10px;
        }

        .navbar .login:hover,
        .navbar .register:hover {
            background-color: #0056b3;
        }

        .container {
            padding: 20px;
        }

        .search-form {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-form button {
            padding: 10px;
            font-size: 16px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .search-form button:hover {
            background-color: #45a049;
        }
        .search-form input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<div class="navbar">
    <div class="username" id="username">Welcome, Guest</div>
    <div class="button-group">
        <button class="home" onclick="goHome()"><i class="fas fa-home"></i></button>
        <button class="login" onclick="window.location.href='/auth/login'">Login</button>
        <button class="register" onclick="window.location.href='/auth/registration'">Registration</button>
    </div>
</div>

<!-- Main Content -->
<div class="container">
    <!-- Search Form -->
    <div class="search-form">
        <button onclick="searchLocation()">Search</button>
        <input type="text" id="search" placeholder="Search for a location..." onkeydown="checkEnter(event)">
    </div>


    <div >
        <p>Please login or registrate in order to find or save location!</p>
    </div>
</div>

<script th:inline="javascript">
    function goHome() {
        window.location.href = '/home';
    }

    function searchLocation() {
        alert("You should login or registrate firstly");
    }

    function checkEnter(event) {
        if (event.key === "Enter") {
            searchLocation();
        }
    }

</script>
</body>
</html>
